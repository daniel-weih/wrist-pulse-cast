name: PulseCast
options:
  bundleIdPrefix: com.hongwei
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    MARKETING_VERSION: 0.1.1
    CURRENT_PROJECT_VERSION: 20260612
    CODE_SIGN_STYLE: Automatic
targets:
  PulseCast:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Shared
      - path: App/PulseCast
        excludes:
          - Info.plist
          - PulseCast.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hongwei.wrist-pulse-cast
        INFOPLIST_FILE: App/PulseCast/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/PulseCast/PulseCast.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: 1
    dependencies:
      - target: PulseCastWatch
        embed: true

  PulseCastWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: App/Shared
      - path: App/PulseCastWatch
        excludes:
          - Info.plist
          - PulseCastWatch.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hongwei.wrist-pulse-cast.watchkitapp
        INFOPLIST_FILE: App/PulseCastWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/PulseCastWatch/PulseCastWatch.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
